name: Package CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clean-install:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: [11, 12]
        php: ['8.2', '8.3', '8.4']
        exclude:
          - laravel: 11
            php: '8.4'

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: bash tests/clean-install.sh ${{ matrix.laravel }}

  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock
      - run: npx tsc --noEmit -p tsconfig.json

  distribution-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: bash tests/archive-install.sh 12
